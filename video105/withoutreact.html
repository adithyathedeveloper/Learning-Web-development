<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Without React</title>
</head>
<body>
    <div class="counter">0</div>
    <button id="btn">Click me</button>
    <script>
        document.getElementById('btn').addEventListener("click",()=>{
            let num = parseInt(document.querySelector('.counter').innerText);
            document.querySelector('.counter').innerText = num + 1;
        })
    </script>
</body>
</html>
